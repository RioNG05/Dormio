# ─── Docker Compose — Production ─────────────────────────────────────────────
# Usage:
#   1. Copy .env.production.example to .env.production and fill in secrets
#   2. Run: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#   3. First time SSL: run the certbot init script (see docs)
#
# Architecture:
#   nginx (443/80) → frontend (3000) + backend (3001)
#   backend → postgres (5432) + redis (6379)
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: dormio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dormio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dormio123}
      POSTGRES_DB: ${POSTGRES_DB:-dormio_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dormio} -d ${POSTGRES_DB:-dormio_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dormio_net

  # ─── Redis ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: dormio_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dormio_net

  # ─── Backend (NestJS) ───────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: dormio_backend
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
      - path: backend/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-dormio}:${POSTGRES_PASSWORD:-dormio123}@postgres:5432/${POSTGRES_DB:-dormio_db}}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      FRONTEND_URL: ${FRONTEND_URL:-https://dormio.site}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      PLATFORM_DEPOSIT_HOLD_DAYS: ${PLATFORM_DEPOSIT_HOLD_DAYS:-7}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL_IMAGE: ${AI_MODEL_IMAGE:-gemini-3.5-flash-lite}
      AI_MODEL_TEXT: ${AI_MODEL_TEXT:-gemini-3.5-flash-lite}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dormio_net

  # ─── Frontend (Next.js) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.dormio.site}
        NEXT_PUBLIC_API_PORT: ${NEXT_PUBLIC_API_PORT:-}
    container_name: dormio_frontend
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
      - path: frontend/.env.production
        required: false
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - dormio_net

  # ─── Nginx (Reverse Proxy + SSL) ────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: dormio_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - dormio_net

volumes:
  postgres_data:
  redis_data:

networks:
  dormio_net:
    driver: bridge

